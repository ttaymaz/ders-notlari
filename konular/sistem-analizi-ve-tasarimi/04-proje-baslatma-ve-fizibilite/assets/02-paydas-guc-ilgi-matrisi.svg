-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#92400e !important" class="nodeLabel"><p>MEMNUN ET (Keep Satisfied)<br />• Yüksek Güç, Düşük İlgi<br />• Örn: Bilgi İşlem Daire Bşk.,<br />Hukuk / KVKK Komisyonu<br />• Strateji: Düzenli brifing ver,<br />kritik kararlarda onay al</p></span></div></foreignObject></g></g><g class="node default kilit" id="my-svg-flowchart-K1-1" data-look="classic" transform="translate(192, 468)"><rect class="basic label-container" style="fill:#fef2f2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-136" y="-138" width="272" height="276"/><g class="label" style="color:#991b1b !important" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div style="color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#991b1b !important" class="nodeLabel"><p>YAKINDAN YÖNET (Key Players)<br />• Yüksek Güç, Yüksek İlgi<br />• Örn: Proje Sponsoru, Rektörlük,<br />Kütüphane Daire Başkanı<br />• Strateji: Birlikte çalış, sürekli<br />ortak karar al, beklentilerini karşıla</p></span></div></foreignObject></g></g></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1d5aa8" stop-opacity="1"/><stop offset="100%" stop-color="hsl(92.3076923077, 0%, 83.5294117647%)" stop-opacity="1"/></linearGradient></svg>